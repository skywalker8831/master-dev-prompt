[project]
name = "master-dev-prompt"
version = "0.1.0"
description = "AI-powered toolkit for transforming meeting transcripts into structured engineering artifacts"
requires-python = ">=3.11"
readme = "README.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
